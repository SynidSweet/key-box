# KBOX-65: time from NTS only (design 3.4, 3.6a). This file replaces Ubuntu's whole: its pool lines are plain NTP, and it has no
# sourcedir, so DHCP-given servers are never used. Two of three operators must agree, and no unauthenticated source is ever selected.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
authselectmode require
minsources 2
nocerttimecheck 1
makestep 1 3
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
