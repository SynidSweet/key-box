# KBOX-45: made at boot by systemd-tmpfiles, which runs as root, so no service needs privilege to make a directory.
# Mode 2750 is setgid: a socket created inside takes the directory's group, and no chown call is needed (the units set UMask=0007,
# so a socket is 0660). One directory serves one group, which is why the lend socket has its own.
# Caddy reaches both http.sock files and not the lend socket; the relay user reaches the lend socket and not core's http.sock.
# Type Path                       Mode User     Group    Age
d /run/keybox                     2750 keybox   caddy    -
d /run/keyrelay                   2750 keyrelay caddy    -
d /run/keybox-lend                2750 keybox   keyrelay -
# The installer's directories (KBOX-6): root-owned; keybox can read them and write neither.
d /etc/keybox                     0755 root     root     -
d /var/lib/keybox-install         0755 root     root     -
# Core's state: the metadata databases and the vault (0700, owned by keybox).
d /var/lib/keybox                 0700 keybox   keybox   -
