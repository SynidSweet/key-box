<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key box</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/paste.js"></script>
</head>
<body>
<main>
<h1>Paste a key</h1>
<p id="phrase" class="status"></p>
<div id="words" class="card"></div>
<div class="card">
<label id="hint-row" hidden>Check the key with
<select id="hint"></select>
</label>
<label>The key
<input id="value" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
</label>
<button id="send">Paste and approve</button>
<p id="status" class="status" role="status"></p>
</div>
</main>
</body>
</html>
